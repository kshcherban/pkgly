[package]
name = "pkgly-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal CLI for Pkgly"

[[bin]]
name = "pkglyctl"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
clap.workspace = true
inquire = "0.7"
nr-api.workspace = true
reqwest.workspace = true
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
